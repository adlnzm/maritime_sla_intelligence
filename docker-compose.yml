services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MARITIME_API_KEY: ${MARITIME_API_KEY:?Set MARITIME_API_KEY}
      MARITIME_OPERATOR_KEY: ${MARITIME_OPERATOR_KEY:?Set MARITIME_OPERATOR_KEY}
    volumes:
      - maritime-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["maritime", "run"]
    volumes:
      - maritime-data:/app/data
    profiles: ["pipeline"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
volumes:
  maritime-data:
