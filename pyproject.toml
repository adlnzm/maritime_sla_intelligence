[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "maritime-sla-intelligence"
version = "0.1.0"
description = "Auditable maritime activity, scenario and decision intelligence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "networkx>=3.3,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "jsonschema>=4.23,<5"]
fabric = ["azure-identity>=1.19,<2"]
azure = ["azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13", "azure-keyvault-secrets>=4.9,<5", "PyJWT[crypto]>=2.10,<3", "azure-monitor-opentelemetry>=1.6,<2"]
ml = ["azure-ai-ml>=1.24,<2", "azure-identity>=1.19,<2", "mlflow-skinny>=2.19,<4", "azureml-mlflow>=1.59,<2"]

[project.scripts]
maritime = "maritime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maritime"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/configs",
  "/tests",
  "/scripts",
  "/azure",
  "/fabric",
  "/sql",
  "/docker",
  "/docs",
  "/power-platform",
  "/.github",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/docker-compose.yml",
  "/compose.demo.yml",
  "/.env.example",
  "/.dockerignore",
  "/.amlignore",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# GHSA-g6cj-pr64-35w5: do not resolve the vulnerable PKCS#7 implementation.
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.hatch.build.targets.wheel.force-include]
"configs/governance.json" = "maritime/governance_contract.json"
