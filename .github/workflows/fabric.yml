name: Deploy and validate Fabric
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: uv sync --frozen --extra dev --extra fabric --extra azure
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/build_fabric_assets.py
      - run: uv run python scripts/deploy_fabric.py --execute
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
          FABRIC_LAKEHOUSE_ID: ${{ vars.FABRIC_LAKEHOUSE_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-execution-evidence
          path: fabric/deployment.json
