name: Platform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - run: uv sync --frozen --extra dev --extra fabric
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q --junitxml=evidence/tests.xml
      - run: uv build
      - run: uv run python scripts/build_fabric_assets.py
      - run: git diff --exit-code fabric/notebooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-build-evidence
          path: |
            evidence/
            dist/
  public-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run maritime run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pipeline-evidence
          path: data/reports/
